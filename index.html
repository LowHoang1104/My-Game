<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giải mã lịch sử 1945–1946</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--ink:#2b2118;--mut:#7a6a58;--red:#b3261e;--gold:#d9a521;--ok:#2e7d32;--tile:#f3e3c0;--bd:#e4d6bb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1713;--card:#272019;--ink:#f3eadb;--mut:#b5a58f;--red:#ef6b61;--gold:#e8b93a;--ok:#6fcf74;--tile:#4a3b22;--bd:#3d3326}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:640px;padding:20px 16px 40px}
h1{font-size:1.5rem;margin:0 0 4px;color:var(--red)}
.sub{color:var(--mut);margin:0 0 16px;font-size:.95rem}
.bar{display:flex;justify-content:space-between;font-weight:600;margin-bottom:8px}
.prog{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}
.q{font-size:.85rem;color:var(--mut);margin-bottom:10px}
.tiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 14px}
.t{min-width:34px;height:40px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:var(--tile);border:1px solid var(--bd);border-radius:8px;font-weight:700;font-size:1.1rem}
.hint{min-height:1.4em;text-align:center;color:var(--red);font-weight:600;margin-bottom:10px;letter-spacing:.05em}
input{width:100%;padding:12px;font-size:1.05rem;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{flex:1;min-width:90px;padding:11px;font-size:.95rem;font-weight:600;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--red);color:#fff;border-color:var(--red)}
button:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;min-height:1.4em;text-align:center;font-weight:600}
.ok{color:var(--ok)}.bad{color:var(--red)}
.end{text-align:center}.end .big{font-size:2.4rem;font-weight:800;color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Giải mã lịch sử</h1>
  <p class="sub">Giai đoạn 1945–1946: sắp xếp lại các chữ cái để tìm ra cụm từ đúng.</p>
  <div class="bar"><span id="qn"></span><span id="sc"></span></div>
  <div class="prog"><i id="pg"></i></div>
  <div class="card" id="game">
    <div class="q" id="len"></div>
    <div class="tiles" id="tiles"></div>
    <div class="hint" id="hint"></div>
    <input id="ans" type="text" autocomplete="off" placeholder="Nhập đáp án của bạn…">
    <div class="row">
      <button class="main" id="chk">Kiểm tra</button>
      <button id="hb">Gợi ý (−30)</button>
      <button id="sh">Xáo chữ</button>
      <button id="sk">Bỏ qua</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>
  <div class="card end" id="end" style="display:none"></div>
</div>
<script>
const Q=[
["CÓNRÀETỢINÂSGCNOT","NGÀN CÂN TREO SỢI TÓC"],
["IẾNQHÁCKỐNGẾHUNCIK","KHÁNG CHIẾN KIẾN QUỐC"],
["CỤNHÌBHDÂỌVN","BÌNH DÂN HỌC VỤ"],
["ỔQUĐHỒCNTỐGÀHNT","THÀNH ĐỒNG TỔ QUỐC"],
["ẮCHDỆTIẾCCNỊHVIB","CHIẾN DỊCH VIỆT BẮC"],
["ẤNẾDBIỨNĨVNGẠBIẾTBN","DĨ BẤT BIẾN ỨNG VẠN BIẾN"],
["ƠĐỊPNBỆHHIỘS","HIỆP ĐỊNH SƠ BỘ"],
["ỆTOHŨMKIẠTIẾG","HŨ GẠO TIẾT KIỆM"],
["ỐNẠIĐNDẠTNÓN","NẠN ĐÓI, NẠN DỐT"],
["ẶOGITNRÙGNCHOÀIGT","THÙ TRONG GIẶC NGOÀI"]
];
const $=id=>document.getElementById(id);
const norm=s=>s.normalize("NFC").toLowerCase().replace(/[^\p{L}]/gu,"");
const plain=s=>norm(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d");
let i=0,score=0,hints=0,letters=[],done=false;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function draw(){$("tiles").innerHTML=letters.map(c=>'<div class="t">'+c+'</div>').join("")}
function load(){
  done=false;hints=0;const [s,a]=Q[i];
  letters=shuffle([...s]);draw();
  const words=a.replace(/[,]/g,"").split(/\s+/);
  $("len").textContent=s.length+" chữ cái · "+words.length+" từ";
  $("qn").textContent="Câu "+(i+1)+"/"+Q.length;
  $("sc").textContent="Điểm: "+score;
  $("pg").style.width=(i/Q.length*100)+"%";
  $("hint").textContent="";$("msg").textContent="";$("msg").className="msg";
  $("ans").value="";$("ans").disabled=false;$("chk").textContent="Kiểm tra";$("hb").disabled=false;$("sk").disabled=false;$("ans").focus();
}
function next(){i++;if(i>=Q.length)finish();else load()}
function finish(){
  $("game").style.display="none";$("end").style.display="block";$("pg").style.width="100%";
  const max=Q.length*100;
  $("end").innerHTML='<div>Hoàn thành!</div><div class="big">'+score+' / '+max+'</div><p>'+(score>=max*0.8?"Xuất sắc! Bạn nắm rất chắc giai đoạn này.":score>=max*0.5?"Khá tốt! Thử chơi lại để đạt điểm cao hơn nhé.":"Cố lên! Chơi lại và dùng gợi ý khi cần.")+'</p><div class="row"><button class="main" id="again">Chơi lại</button></div>';
  $("again").onclick=()=>{i=0;score=0;$("end").style.display="none";$("game").style.display="block";load()};
}
function check(){
  if(done){next();return}
  const a=Q[i][1],v=$("ans").value;
  if(!norm(v))return;
  if(norm(v)===norm(a)||plain(v)===plain(a)){
    const pts=Math.max(100-hints*30,10);score+=pts;done=true;
    $("msg").textContent="Chính xác! +"+pts+" điểm — "+a;$("msg").className="msg ok";
    $("sc").textContent="Điểm: "+score;$("ans").disabled=true;$("hb").disabled=true;$("sk").disabled=true;
    $("chk").textContent=i===Q.length-1?"Xem kết quả":"Câu tiếp theo";$("chk").focus();
  }else{$("msg").textContent="Chưa đúng, thử lại nhé!";$("msg").className="msg bad"}
}
$("chk").onclick=check;
$("ans").addEventListener("keydown",e=>{if(e.key==="Enter")check()});
$("sh").onclick=()=>{if(!done){letters=shuffle(letters);draw()}};
$("sk").onclick=()=>{
  if(done)return;
  $("msg").textContent="Đáp án: "+Q[i][1];$("msg").className="msg bad";done=true;
  $("ans").disabled=true;$("hb").disabled=true;$("sk").disabled=true;
  $("chk").textContent=i===Q.length-1?"Xem kết quả":"Câu tiếp theo";
};
$("hb").onclick=()=>{
  if(done)return;hints++;
  const words=Q[i][1].replace(/,/g,"").split(/\s+/);
  if(hints===1){$("hint").textContent=words.map(w=>"_".repeat([...w].length)).join("  ")}
  else{$("hint").textContent=words.map(w=>[...w][0]+"_".repeat([...w].length-1)).join("  ")}
  if(hints>=2)$("hb").disabled=true;
};
load();
</script>
</body>
</html>
